# Somatic Evolution Research Group — site configuration
#
# This file controls site-wide settings: the title shown in the browser tab
# and navigation, the URL, and plugin behaviour. It is not where you add a
# paper, a team member, a news item or a job ad — those live in the
# _data/*.yml files (see EDITING.md at the repository root).

title: Somatic Evolution Research Group
description: >-
  Verena Körber's group studies the dynamics of somatic evolution in human
  stem cell systems — how division, differentiation and clonal selection
  shape tissue ageing and malignant transformation.
url: "https://verenak90.github.io"
baseurl: ""

author: Dr Verena Körber
email: verena.korber@ndcls.ox.ac.uk
street_address: Weatherall Institute of Molecular Medicine, Headley Way
city: Oxford
zip_code: OX3 9DS
country: United Kingdom

# jekyll-seo-tag reads title/description/url above automatically; twitter
# and social fields are left out deliberately (no social widgets, see brief).
logo: assets/images/favicon.png

# Jekyll defaults to the "minima" theme when none is set. The brief rules
# out any remote theme or CSS framework, so it's disabled explicitly.
theme: null

permalink: /:title/

markdown: kramdown
kramdown:
  input: GFM

plugins:
  - jekyll-seo-tag
  - jekyll-redirect-from
  - jekyll-sitemap

exclude:
  # Setting this key replaces Jekyll's own default exclude list rather
  # than adding to it, so the usual defaults are repeated here.
  - vendor/
  - node_modules/
  - REDESIGN_BRIEF.md
  - EDITING.md
  - "*.gemspec"
  - LICENSE.md
  - CONTRIBUTING.md
  - README.md
  - Gemfile
  - Gemfile.lock
  - files/
  - files2/
  - files.zip
  - files2.zip
  - DSC00009.jpeg
  - Photo_VK.png
  - "Gemini_Generated_Image_*.jpeg"
