---
layout: default
---
<div class="page{% if page.wide %} page--wide{% endif %}">
  <div class="{% if page.wide %}container{% else %}prose{% endif %}">
    {% if page.logo %}
      <img class="page__logo" src="{{ "/assets/images/" | append: page.logo | relative_url }}" alt="">
    {% endif %}
    <h1>{{ page.title }}</h1>
    {{ content }}
  </div>
</div>
